# Littlefield bot settings. Edit on GitHub and commit; the next run picks it up.

dry_run: false            # true = log decisions, change nothing
allow_loans: true         # borrow (20%/yr + 5% fee) to fund fast-payback capacity
stop_after_day: 299.5

# phone notifications: install the ntfy app and subscribe to this topic (free, no account)
notify_topic: littlefield-bnb-5549f4

# hard limits, applied after the policy
max_spend_per_run: 2000000
max_buy_per_station_per_run: 12
max_sell_per_run: 3

# policy knobs (defaults in lf/policy.py, tuned on the digital twin)
# 9 Nov, 21:40: switched to split lots + contract 3 after testing the seniors' playbook.
# Twin, 8 seeds each: demand x0.7 $2.91M, x1.0 $3.54M, x1.4 $3.77M (was $1.81M / $2.27M / $2.38M).
policy:
  lots: 3                 # 3 lots of 20 kits per job: lots overlap across stations, flow ~5.2h
  target_contract: 3      # $1,500 for 6h, falls to $0 at 12h; reverts to c2 if lead time > 0.40 day
  util_target: 0.75       # plan machines for 75% utilisation (c3 needs short queues)
  wip_days: 0.2           # WIP cap = throughput x 0.2 day -> lead time inside the 6h quote
  flush_days: 6           # clear the day-50 backlog over ~6 days
  max_debt: 1200000       # tested 0.9M to 3M: with plan-for-70, 1.2M is best unless demand is confirmed high
  peak_prior: 70          # 10 Nov 00:55: plan capacity for a 70 jobs/day peak (seniors' data).
                          # Twin: demand low/forecast/high $2.90M/$3.84M/$4.73M (was $2.92M/$3.45M/$3.59M)
  max_spend_per_run: 3000000
  max_machines: 40
  safety_days: 1.0        # kit safety stock
  rule: pri4              # tester priority: fifo | pri2 | pri4
  sell_from_day: 200
  no_edit_mode: hold      # if contract/WIP never become editable: stop buying kits, keep cash
  hold_after_day: 55
