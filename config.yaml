# Littlefield bot settings. Edit on GitHub and commit; the next run picks it up.

dry_run: false            # true = log decisions, change nothing
allow_loans: true         # borrow (20%/yr + 5% fee) to fund fast-payback capacity
stop_after_day: 299.5

# hard limits, applied after the policy
max_spend_per_run: 600000
max_buy_per_station_per_run: 8
max_sell_per_run: 3

# policy knobs (defaults in lf/policy.py, tuned on the digital twin)
policy:
  util_target: 0.90       # planned machine utilisation at forecast demand
  flush_days: 6           # clear the day-50 backlog over ~6 days
  wip_days: 0.6           # WIP cap = throughput x 0.6 day -> lead time < 1 day
  max_debt: 600000
  safety_days: 1.0        # kit safety stock
  rule: pri4              # tester priority: fifo | pri2 | pri4
  sell_from_day: 200
  no_edit_mode: hold      # if contract/WIP never become editable: stop buying kits, keep cash
  hold_after_day: 55
