name: littlefield-loop

# Runs the bot every 10 minutes inside one long job, then restarts itself.
# GitHub's own cron never fired for this repo, so this keeps the bot going on its own.
# A workflow may re-dispatch itself with GITHUB_TOKEN (workflow_dispatch is the documented exception).
# To stop it: cancel the running job (a cancelled job does not restart), or Disable workflow,
# or set the repository variable PAUSE=1 to keep it alive but make every bot run a no-op.

on:
  workflow_dispatch:

concurrency:
  group: littlefield-loop
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the bot every 10 minutes (about 5.5 hours)
        env:
          LF_ID: ${{ secrets.LF_ID }}
          LF_PASSWORD: ${{ secrets.LF_PASSWORD }}
          LF_INSTITUTION: iimb
          PAUSE: ${{ vars.PAUSE }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: |
          git config user.name "littlefield-bot"
          git config user.email "bot@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull --rebase --autostash -q || true          # pick up config.yaml edits
            python bot.py || echo "bot run failed (will retry next cycle)"
            git add state logs || true
            git commit -q -m "bot run $(date -u +%H:%M) [skip ci]" || true
            git pull --rebase --autostash -q || true
            git push -q || true
            if tail -n 30 logs/actions.log 2>/dev/null | grep -Eq ' day (299\.[5-9]|3[0-9][0-9])'; then
              echo "game over (day 300 reached)"; touch .game_over; break
            fi
            sleep 600
          done
      - name: Restart this loop
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .game_over ]; then echo "game over, not restarting"; exit 0; fi
          gh workflow run loop.yml --repo "${{ github.repository }}" --ref main
