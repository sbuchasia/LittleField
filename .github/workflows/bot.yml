name: littlefield-bot

on:
  schedule:
    - cron: "*/10 * * * *"      # every ~10 min (GitHub may delay a few min); 1 sim day = ~29 min
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and log only, change nothing"
        type: boolean
        default: true

concurrency:
  group: littlefield-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          LF_ID: ${{ secrets.LF_ID }}
          LF_PASSWORD: ${{ secrets.LF_PASSWORD }}
          LF_INSTITUTION: iimb
          PAUSE: ${{ vars.PAUSE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || vars.DRY_RUN }}
        run: python bot.py
      - name: Save state and log
        if: always()
        run: |
          git config user.name "littlefield-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state logs || true
          git commit -m "bot run $(date -u +%H:%M) [skip ci]" || exit 0
          git pull --rebase --autostash || true
          git push || true
